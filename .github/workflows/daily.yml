name: 每日抓取 GitHub Trending

on:
  schedule:
        # UTC 01:30 = 北京时间 09:30
        - cron: "30 1 * * *"
  workflow_dispatch:   # 允许在网页上手动点一下就跑

permissions:
  contents: write      # 需要写权限，把数据库和面板提交回仓库

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 + 生成面板 + 推送飞书
        env:
          # Actions 自带的 token，用来提高备用数据源的调用配额
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python run.py all

      - name: 把数据和面板提交回仓库
        run: |
          git config user.name "trending-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "trending: $(date -u +%Y-%m-%d)"
          git push
