# ============ 抓哪些榜单 ============
# since: daily / weekly / monthly
# language: 留空 = 全部语言；也可写 python / typescript / rust / go 等
targets:
  - since: daily
    language: ""
  - since: weekly
    language: ""
  - since: daily
    language: python

# ============ 重点关注关键词 ============
# 按"这东西能不能直接用在极客上线的交付里"来选的，分四类。
# 命中的项目会在面板上标蓝、在飞书卡片里带 ⭐
# 匹配范围：仓库名 + 项目描述，按词边界匹配（java 不会误命中 javascript）
keywords:
  # --- 一、能直接省交付工时的 ---
  - low-code
  - lowcode
  - no-code
  - form builder
  - form designer
  - admin dashboard
  - admin panel
  - scaffold
  - boilerplate
  - starter kit
  - crud
  - workflow engine
  - bpmn

  # --- 二、原型和设计环节 ---
  - prototype
  - wireframe
  - design system
  - ui component
  - component library
  - figma
  - whiteboard
  - flowchart
  - diagram

  # --- 三、能包装成客户方案卖的 AI 能力 ---
  - rag
  - knowledge base
  - mcp
  - agent framework
  - multi-agent
  - coding agent
  - chatbot
  - customer service
  - document parsing
  - ocr
  - text-to-speech
  - digital human

  # --- 四、你们的技术栈和交付形态 ---
  - spring boot
  - java
  - mini program
  - miniprogram
  - wechat
  - uni-app
  - taro
  - erp
  - crm
  - docx
  - excel
  - spreadsheet
  - self-hosted

# 说明：故意没有放 "ai" 这种泛词。
# trending 榜上近一半项目描述里都有 ai，留着等于没过滤。
# 宁可漏一些，也别让"关注"标记贬值成背景噪音。

# ============ 推送设置 ============
notify:
  # 飞书群自定义机器人的 webhook 地址
  # 建议留空，改用环境变量 FEISHU_WEBHOOK（避免泄露）
  feishu_webhook: ""
  # 如果机器人开启了"签名校验"，把密钥填这里或用环境变量 FEISHU_SECRET
  feishu_secret: ""
  # 推送榜单的前 N 条
  top_n: 10
  # true = 只推送今天新上榜的项目（老项目不再重复打扰）
  only_new: false
  # 推送哪个榜单（对应上面 targets 里的一项）
  since: daily
  language: ""

# ============ 备用数据源 ============
# 爬虫抓不到时（多半是 GitHub 改版），自动降级到官方 Search API
# 注意：Search API 给的不是 Trending 榜，只是"最近创建 + star 最多"的近似
fallback:
  enabled: true

# ============ 路径 ============
db_path: data/trending.db
dashboard_path: docs/index.html
