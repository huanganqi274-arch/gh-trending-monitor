# ============ 抓哪些榜单 ============
# 这是「抓取清单」，决定去 GitHub 拉哪些页面。
# GitHub 全语言日榜单页最多 25 条（常常只有十几条），
# 所以要靠合并多个语言榜才能凑够几十个项目。
targets:
  - since: daily
    language: ""
  - since: daily
    language: python
  - since: daily
    language: typescript
  - since: daily
    language: javascript
  - since: daily
    language: java
  - since: daily
    language: html
  - since: weekly
    language: ""
  - since: weekly
    language: python
  - since: weekly
    language: typescript

# ============ 面板上显示哪些板块 ============
# 把上面抓到的语言榜合并去重，按当日新增 star 重新排序。
boards:
  - label: 日榜
    since: daily
    merge_languages: ["", python, typescript, javascript, java, html]
  - label: 周榜
    since: weekly
    merge_languages: ["", python, typescript]

# ============ 原榜板块 ============
# 纯粹复刻 GitHub Trending 全语言日榜，不合并、不标注。
raw_board:
  enabled: true
  since: daily
  language: ""

# ============ 重点关注关键词 ============
# 分组会原样显示在面板顶部，方便团队知道我们在盯什么方向。
# 匹配范围：仓库名 + 项目描述，按词边界匹配（java 不会误命中 javascript）
keywords:
  产品：图表 / 文档 / 演示:
    - diagram
    - flowchart
    - mindmap
    - whiteboard
    - sequence diagram
    - wireframe
    - prototype
    - mockup
    - slides
    - slide deck
    - presentation
    - ppt
    - keynote
    - markdown
    - docx
    - excel
    - spreadsheet
    - pdf
    - export
    - prd
    - requirements
    - user story
    - roadmap
    - changelog

  UI 与设计:
    - design system
    - component library
    - ui kit
    - ui component
    - figma
    - design token
    - landing page
    - tailwind
    - shadcn
    - icon
    - illustration
    - animation
    - motion
    - typography
    - dashboard
    - screenshot to code
    - design to code
    - theme editor

  Agent Skill 生态:
    - agent skill
    - skill
    - subagent
    - mcp

  技术与交付:
    - low-code
    - no-code
    - form builder
    - workflow engine
    - spring boot
    - java
    - mini program
    - uni-app
    - wechat
    - erp
    - crm
    - rag
    - knowledge base
    - ocr
    - chatbot

# 刻意没放的词及原因：
#   ai          —— 榜上近一半项目都带，等于没过滤
#   claude code —— 实测命中 30 个，里面全是求职、提示词泄露之类的无关项目
#   self-hosted —— 捞上来的多是 VPN、邮件服务器这类基础设施
#   template / theme / admin / spec / docs —— 太泛，噪音大

# ============ 翻译 ============
# 关掉了。技术描述机翻质量一般，留着原文更准。想再试改成 true。
translate:
  enabled: false
  target: zh-CN

# ============ 备用数据源 ============
fallback:
  enabled: true

# ============ 推送设置 ============
notify:
  # 建议留空，用环境变量 FEISHU_WEBHOOK（GitHub 上存在 Secrets 里）
  feishu_webhook: ""
  feishu_secret: ""
  top_n: 10
  only_new: false
  # 推哪个板块（对应 boards 里的 label）
  board: 日榜

# ============ 路径 ============
db_path: data/trending.db
dashboard_path: docs/index.html
